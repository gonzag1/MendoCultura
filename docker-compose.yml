services:
  postgres:
    image: postgres:16-alpine
    container_name: mendocultura-postgres
    environment:
      POSTGRES_DB: mendocultura
      POSTGRES_USER: mendocultura
      POSTGRES_PASSWORD: mendocultura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mendocultura -d mendocultura"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: mendocultura-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://mendocultura:mendocultura@postgres:5432/mendocultura?sslmode=disable
      JWT_SECRET: local-development-secret
      SEED_DATA: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: mendocultura-frontend
    depends_on:
      - backend
    ports:
      - "4321:4321"

volumes:
  postgres_data:
