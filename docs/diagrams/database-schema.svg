<text x="60" y="1460" class="note">PK: clave primaria · FK: clave foránea · UQ: único · ?: campo puntero opcional · 0..N: cero o muchos registros</text>
<text x="60" y="1491" class="note">Línea punteada / REF: audit_logs.user_id es una referencia lógica; el modelo no declara una FK a users.</text>
<text x="60" y="1522" class="note">events.organizer_id apunta a users.id. No hay una FK de eventos a organizer_profiles ni un validator_id en tickets.</text>
